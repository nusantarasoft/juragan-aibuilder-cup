name: nusantarasoft-remote

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATA LAKEHOUSE (Nessie + Dremio)
  # ═══════════════════════════════════════════════════════════════════════════

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    restart: unless-stopped
    networks:
      remote-network:
    ports:
      - 19120:19120

  dremio:
    platform: linux/x86_64
    image: dremio/dremio-oss:latest
    container_name: dremio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10g
        reservations:
          memory: 6g
    ports:
      - 9047:9047
      - 31010:31010
      - 32010:32010
      - 45678:45678
    environment:
      - DREMIO_JAVA_SERVER_EXTRA_OPTS=-Dpaths.dist=file:///opt/dremio/data/dist
    volumes:
      - dremio-data:/opt/dremio/data
    networks:
      remote-network:

networks:
  remote-network:
    driver: bridge

volumes:
  dremio-data:
