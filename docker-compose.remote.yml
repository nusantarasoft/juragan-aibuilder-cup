name: nusantarasoft-remote

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATA LAKEHOUSE (Nessie + Dremio)
  # ═══════════════════════════════════════════════════════════════════════════

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    restart: unless-stopped
    networks:
      remote-network:
    ports:
      - 19120:19120

  dremio:
    platform: linux/x86_64
    image: dremio/dremio-oss:latest
    container_name: dremio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10g
        reservations:
          memory: 6g
    ports:
      - 9047:9047
      - 31010:31010
      - 32010:32010
      - 45678:45678
    environment:
      - DREMIO_JAVA_SERVER_EXTRA_OPTS=-Dpaths.dist=file:///opt/dremio/data/dist
    volumes:
      - dremio-data:/opt/dremio/data
    networks:
      remote-network:

  # ═══════════════════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════════════════

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.4.3}
    container_name: waha
    restart: unless-stopped
    shm_size: "2gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 768m
    ports:
      - "${WAHA_HOST_PORT:-3010}:3000"
    environment:
      # Set WHATSAPP_HOOK_URL in .env to LOCAL_HOST_IP middleware when WAHA runs on remote device
      - WHATSAPP_HOOK_URL=${WHATSAPP_HOOK_URL:-http://host.docker.internal:4001/api/studio/whatsapp/webhook}
      - WHATSAPP_HOOK_EVENTS=message,message.any
      - WHATSAPP_HOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY:-}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_API_KEY_PLAIN=${WAHA_API_KEY_PLAIN:-${WAHA_API_KEY:-}}
      - WAHA_API_KEY_EXCLUDE_PATH=health
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-}
      - WHATSAPP_SWAGGER_USERNAME=${WHATSAPP_SWAGGER_USERNAME:-admin}
      - WHATSAPP_SWAGGER_PASSWORD=${WHATSAPP_SWAGGER_PASSWORD:-}
      - WAHA_BASE_URL=http://waha:3000
      - WHATSAPP_DEFAULT_SESSION=${WAHA_SESSION:-default}
      - WHATSAPP_DEFAULT_ENGINE=${WAHA_DEFAULT_ENGINE:-WEBJS}
      - WAHA_SESSION_ENGINE_INFO_TIMEOUT=15000
      - WHATSAPP_RESTART_ALL_SESSIONS=True
    volumes:
      - waha-sessions:/app/.sessions
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - remote-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"X-Api-Key: $$WAHA_API_KEY\" -O - http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

networks:
  remote-network:
    driver: bridge

volumes:
  dremio-data:
  waha-sessions:
