name: nusantarasoft-remote

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATA LAKEHOUSE (Nessie + Dremio)
  # ═══════════════════════════════════════════════════════════════════════════

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    restart: unless-stopped
    networks:
      remote-network:
    ports:
      - 19120:19120

  dremio:
    platform: linux/x86_64
    image: dremio/dremio-oss:latest
    container_name: dremio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10g
        reservations:
          memory: 6g
    ports:
      - 9047:9047
      - 31010:31010
      - 32010:32010
      - 45678:45678
    environment:
      - DREMIO_JAVA_SERVER_EXTRA_OPTS=-Dpaths.dist=file:///opt/dremio/data/dist
    volumes:
      - dremio-data:/opt/dremio/data
    networks:
      remote-network:

  # ═══════════════════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════════════════

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
    ports:
      - "18789:18789"
    environment:
      - NODE_ENV=production
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      - openclaw-config:/home/node/.openclaw
    networks:
      - remote-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:18789/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  remote-network:
    driver: bridge

volumes:
  dremio-data:
  openclaw-config:
