# ═════════════════════════════════════════════════════════════════════════════
# Google Cloud Build — Deploy `middleware` + `admin` to Google Cloud Run
# ═════════════════════════════════════════════════════════════════════════════
# Trigger automatically via GitHub -> Cloud Build trigger, or run manually:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast2,_NEXT_PUBLIC_SUPABASE_URL=https://your-supabase.url,_NEXT_PUBLIC_SUPABASE_ANON_KEY=your-anon-key
# ═════════════════════════════════════════════════════════════════════════════

steps:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & Push Middleware (NestJS GraphQL + AI Studio Backend)
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-middleware'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:latest'
      - './middleware'

  - id: 'push-middleware'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-middleware']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware'

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Deploy Middleware to Cloud Run & Capture Its Public URL
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-middleware'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-middleware']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run deploy "${_MIDDLEWARE_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:${SHORT_SHA}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=4001 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,SUPABASE_URL=${_SUPABASE_URL},SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY},SUPABASE_SERVICE_KEY=${_SUPABASE_SERVICE_KEY},S3_ENDPOINT=${_S3_ENDPOINT},S3_BUCKET=${_S3_BUCKET}"

        MW_URL=$$(gcloud run services describe "${_MIDDLEWARE_SERVICE}" --region="${_REGION}" --format='value(status.url)')
        echo "Middleware deployed at: $${MW_URL}"
        if [ -n "${_NEXT_PUBLIC_GRAPHQL_URL}" ]; then
          echo "${_NEXT_PUBLIC_GRAPHQL_URL}" > /workspace/graphql_url.txt
        else
          echo "$${MW_URL}/graphql" > /workspace/graphql_url.txt
        fi

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build & Push Admin (Next.js AI Studio, Virtual Office & Agentic OS)
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-admin'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['deploy-middleware']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        GRAPHQL_URL=$$(cat /workspace/graphql_url.txt)
        echo "Building admin with NEXT_PUBLIC_GRAPHQL_URL=$${GRAPHQL_URL}"
        docker build \
          --build-arg NEXT_PUBLIC_GRAPHQL_URL="$${GRAPHQL_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_NEXT_PUBLIC_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${_NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_S3_ENDPOINT="${_S3_ENDPOINT}" \
          --build-arg NEXT_PUBLIC_S3_BUCKET="${_S3_BUCKET}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:${SHORT_SHA}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:latest" \
          ./admin

  - id: 'push-admin'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-admin']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin'

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Deploy Admin to Cloud Run
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-admin'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-admin']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        GRAPHQL_URL=$$(cat /workspace/graphql_url.txt)
        gcloud run deploy "${_ADMIN_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:${SHORT_SHA}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_PUBLIC_GRAPHQL_URL=$${GRAPHQL_URL},GRAPHQL_API_URL=$${GRAPHQL_URL},NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY},NEXT_PUBLIC_S3_ENDPOINT=${_S3_ENDPOINT},NEXT_PUBLIC_S3_BUCKET=${_S3_BUCKET}"

substitutions:
  _REGION: 'asia-southeast2'
  _AR_REPO: 'nusantarasoft'
  _MIDDLEWARE_SERVICE: 'nusantarasoft-middleware'
  _ADMIN_SERVICE: 'nusantarasoft-admin'
  _NEXT_PUBLIC_GRAPHQL_URL: ''
  _SUPABASE_URL: 'https://your-project.supabase.co'
  _NEXT_PUBLIC_SUPABASE_URL: 'https://your-project.supabase.co'
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: 'replace-with-supabase-anon-key'
  _SUPABASE_SERVICE_KEY: 'replace-with-supabase-service-role-key'
  _S3_ENDPOINT: 'https://storage.googleapis.com'
  _S3_BUCKET: 'cms-media'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
