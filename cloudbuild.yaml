# ═════════════════════════════════════════════════════════════════════════════
# Google Cloud Build — Deploy three Juragan services to Google Cloud Run
# ═════════════════════════════════════════════════════════════════════════════
# Project (example): juragan-aibuilder-cup · Region: asia-southeast2
#
# Service map (migration-safe: deploy updates existing service names):
#   juragan-api      ← middleware/
#   juragan          ← admin/
#   juragan-showcase ← brochure-gallery/
#
# Out of scope (Akbar): juragan-landing / landing-page/ — NOT deployed to Cloud Run.
#
# Deps (Supabase, S3, Hermes, Kong) stay on VPS nusantarasoft — point env at
# those public URLs; do not provision GCP replacements in this pipeline.
#
# Secrets (GCP Secret Manager — create before first deploy; do not invent values):
#   supabase-anon-key          → SUPABASE_ANON_KEY / NEXT_PUBLIC_SUPABASE_ANON_KEY
#   supabase-service-key       → SUPABASE_SERVICE_KEY
#   s3-access-key              → S3_ACCESS_KEY
#   s3-secret-key              → S3_SECRET_KEY
#   whatsapp-webhook-hmac-key  → WHATSAPP_WEBHOOK_HMAC_KEY (optional; set _SECRET_WA_HMAC)
#
# Runtime inject via --set-secrets. Non-secret URLs stay --set-env-vars
# (SUPABASE_URL, S3_ENDPOINT, S3_BUCKET, S3_REGION, HERMES_BASE_URL, …).
# Next.js bake: anon key fetched from Secret Manager during image build
# (availableSecrets), never as a Cloud Build substitution.
#
# Manual submit (no GitHub→GCP auto-deploy required for v1):
#   gcloud builds submit --config=cloudbuild.yaml \
#     --project=juragan-aibuilder-cup \
#     --substitutions=_REGION=asia-southeast2,_SUPABASE_URL=https://…,_NEXT_PUBLIC_SUPABASE_URL=https://…,_S3_ENDPOINT=https://…
#
# Artifact Registry: default repo name remains `nusantarasoft` (legacy brand).
# Image paths stay folder-based (…/middleware, …/admin, …/brochure-gallery).
# ═════════════════════════════════════════════════════════════════════════════

steps:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & Push juragan-api (NestJS GraphQL + AI Studio Backend)
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-api'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:latest'
      - './middleware'

  - id: 'push-api'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-api']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware'

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Deploy juragan-api & capture public GraphQL URL
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-api'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-api']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        SECRETS="SUPABASE_ANON_KEY=${_SECRET_SUPABASE_ANON}:latest"
        SECRETS="$${SECRETS},SUPABASE_SERVICE_KEY=${_SECRET_SUPABASE_SERVICE}:latest"
        SECRETS="$${SECRETS},S3_ACCESS_KEY=${_SECRET_S3_ACCESS}:latest"
        SECRETS="$${SECRETS},S3_SECRET_KEY=${_SECRET_S3_SECRET}:latest"
        if [ -n "${_SECRET_WA_HMAC}" ]; then
          SECRETS="$${SECRETS},WHATSAPP_WEBHOOK_HMAC_KEY=${_SECRET_WA_HMAC}:latest"
        fi
        gcloud run deploy "${_API_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:${_IMAGE_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=4001 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,SUPABASE_URL=${_SUPABASE_URL},S3_ENDPOINT=${_S3_ENDPOINT},S3_BUCKET=${_S3_BUCKET},S3_REGION=${_S3_REGION},HERMES_BASE_URL=${_HERMES_BASE_URL}" \
          --set-secrets="$${SECRETS}"

        API_URL=$$(gcloud run services describe "${_API_SERVICE}" --region="${_REGION}" --format='value(status.url)')
        echo "juragan-api deployed at: $${API_URL}"
        if [ -n "${_NEXT_PUBLIC_GRAPHQL_URL}" ]; then
          echo "${_NEXT_PUBLIC_GRAPHQL_URL}" > /workspace/graphql_url.txt
        else
          echo "$${API_URL}/graphql" > /workspace/graphql_url.txt
        fi
        echo "$${API_URL}" > /workspace/api_url.txt

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build & Push juragan (admin Next.js) — GraphQL URL + anon from SM
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-admin'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['deploy-api']
    entrypoint: 'bash'
    secretEnv: ['SM_SUPABASE_ANON_KEY']
    args:
      - '-c'
      - |
        set -euo pipefail
        GRAPHQL_URL=$$(cat /workspace/graphql_url.txt)
        echo "Building admin with NEXT_PUBLIC_GRAPHQL_URL=$${GRAPHQL_URL} (anon key from Secret Manager)"
        docker build \
          --build-arg NEXT_PUBLIC_GRAPHQL_URL="$${GRAPHQL_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_NEXT_PUBLIC_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$${SM_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_S3_ENDPOINT="${_S3_ENDPOINT}" \
          --build-arg NEXT_PUBLIC_S3_BUCKET="${_S3_BUCKET}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:${_IMAGE_TAG}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:latest" \
          ./admin

  - id: 'push-admin'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-admin']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin'

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Deploy juragan (admin)
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-admin'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-admin']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        GRAPHQL_URL=$$(cat /workspace/graphql_url.txt)
        SECRETS="NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SECRET_SUPABASE_ANON}:latest"
        SECRETS="$${SECRETS},S3_ACCESS_KEY=${_SECRET_S3_ACCESS}:latest"
        SECRETS="$${SECRETS},S3_SECRET_KEY=${_SECRET_S3_SECRET}:latest"
        gcloud run deploy "${_ADMIN_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:${_IMAGE_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_PUBLIC_GRAPHQL_URL=$${GRAPHQL_URL},GRAPHQL_API_URL=$${GRAPHQL_URL},NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_S3_ENDPOINT=${_S3_ENDPOINT},NEXT_PUBLIC_S3_BUCKET=${_S3_BUCKET},S3_ENDPOINT=${_S3_ENDPOINT},S3_BUCKET=${_S3_BUCKET},S3_REGION=${_S3_REGION}" \
          --set-secrets="$${SECRETS}"

        ADMIN_URL=$$(gcloud run services describe "${_ADMIN_SERVICE}" --region="${_REGION}" --format='value(status.url)')
        echo "juragan deployed at: $${ADMIN_URL}"
        echo "$${ADMIN_URL}" > /workspace/admin_url.txt

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Build & Push juragan-showcase — admin URL + anon from SM
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-showcase'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['deploy-admin']
    entrypoint: 'bash'
    secretEnv: ['SM_SUPABASE_ANON_KEY']
    args:
      - '-c'
      - |
        set -euo pipefail
        ADMIN_URL=$$(cat /workspace/admin_url.txt)
        echo "Building showcase with ADMIN_URL=$${ADMIN_URL} (anon key from Secret Manager)"
        docker build \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_NEXT_PUBLIC_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$${SM_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_S3_ENDPOINT="${_S3_ENDPOINT}" \
          --build-arg NEXT_PUBLIC_S3_BUCKET="${_S3_BUCKET}" \
          --build-arg NEXT_PUBLIC_ADMIN_URL="$${ADMIN_URL}" \
          --build-arg NEXT_PUBLIC_LANDING_URL="${_NEXT_PUBLIC_LANDING_URL}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery:${_IMAGE_TAG}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery:latest" \
          ./brochure-gallery

  - id: 'push-showcase'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-showcase']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery'

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Deploy juragan-showcase
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-showcase'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-showcase']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        ADMIN_URL=$$(cat /workspace/admin_url.txt)
        SECRETS="NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SECRET_SUPABASE_ANON}:latest"
        SECRETS="$${SECRETS},SUPABASE_SERVICE_KEY=${_SECRET_SUPABASE_SERVICE}:latest"
        SECRETS="$${SECRETS},S3_ACCESS_KEY=${_SECRET_S3_ACCESS}:latest"
        SECRETS="$${SECRETS},S3_SECRET_KEY=${_SECRET_S3_SECRET}:latest"
        gcloud run deploy "${_SHOWCASE_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery:${_IMAGE_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_S3_ENDPOINT=${_S3_ENDPOINT},NEXT_PUBLIC_S3_BUCKET=${_S3_BUCKET},NEXT_PUBLIC_ADMIN_URL=$${ADMIN_URL},NEXT_PUBLIC_LANDING_URL=${_NEXT_PUBLIC_LANDING_URL},S3_ENDPOINT=${_S3_ENDPOINT},S3_BUCKET=${_S3_BUCKET},S3_REGION=${_S3_REGION}" \
          --set-secrets="$${SECRETS}"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/supabase-anon-key/versions/latest
      env: 'SM_SUPABASE_ANON_KEY'

substitutions:
  _REGION: 'asia-southeast2'
  # Legacy Artifact Registry repo name — keep unless ops renames AR in GCP.
  _AR_REPO: 'nusantarasoft'
  _IMAGE_TAG: 'latest'
  # Cloud Run service names (must match live services — migration-safe updates)
  _API_SERVICE: 'juragan-api'
  _ADMIN_SERVICE: 'juragan'
  _SHOWCASE_SERVICE: 'juragan-showcase'
  _NEXT_PUBLIC_GRAPHQL_URL: ''
  # Optional external marketing/landing URL for showcase bake (no Cloud Run landing service)
  _NEXT_PUBLIC_LANDING_URL: ''
  # Point these at VPS nusantarasoft (or public Supabase/S3 URLs) — not GCP replacements
  _SUPABASE_URL: 'https://your-supabase-or-vps-kong.example'
  _NEXT_PUBLIC_SUPABASE_URL: 'https://your-supabase-or-vps-kong.example'
  _S3_ENDPOINT: 'https://your-vps-s3-or-gcs.example'
  _S3_BUCKET: 'cms-media'
  _S3_REGION: 'asia-southeast2'
  _HERMES_BASE_URL: 'https://hermes.your-vps.example'
  # Secret Manager secret *ids* (must match secrets created in GCP — no plaintext values)
  _SECRET_SUPABASE_ANON: 'supabase-anon-key'
  _SECRET_SUPABASE_SERVICE: 'supabase-service-key'
  _SECRET_S3_ACCESS: 's3-access-key'
  _SECRET_S3_SECRET: 's3-secret-key'
  # Optional: set to whatsapp-webhook-hmac-key to attach WA HMAC on juragan-api
  _SECRET_WA_HMAC: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '2400s'
