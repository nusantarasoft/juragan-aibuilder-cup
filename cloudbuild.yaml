# ═════════════════════════════════════════════════════════════════════════════
# Google Cloud Build — Deploy four Juragan services to Google Cloud Run
# ═════════════════════════════════════════════════════════════════════════════
# Project (example): juragan-aibuilder-cup · Region: asia-southeast2
#
# Service map (migration-safe: deploy updates existing service names):
#   juragan-api      ← middleware/
#   juragan          ← admin/
#   juragan-landing  ← landing-page/
#   juragan-showcase ← brochure-gallery/
#
# Deps (Supabase, S3, Hermes, Kong) stay on VPS nusantarasoft — point env at
# those public URLs; do not provision GCP replacements in this pipeline.
#
# Secrets: prefer Secret Manager + --set-secrets (see docs/deploy-cloud-run.md).
# Substitutions below use placeholders only — never put real keys in trigger
# history. Example (after creating secrets):
#   --set-secrets=SUPABASE_SERVICE_KEY=supabase-service-key:latest,\
#     S3_ACCESS_KEY=s3-access-key:latest,S3_SECRET_KEY=s3-secret-key:latest
#
# Manual submit (no GitHub→GCP auto-deploy required for v1):
#   gcloud builds submit --config=cloudbuild.yaml \
#     --project=juragan-aibuilder-cup \
#     --substitutions=_REGION=asia-southeast2,_SUPABASE_URL=https://…,_NEXT_PUBLIC_SUPABASE_URL=https://…
#
# Artifact Registry: default repo name remains `nusantarasoft` (legacy brand).
# Image paths stay folder-based (…/middleware, …/admin, …/landing-page, …/brochure-gallery).
# ═════════════════════════════════════════════════════════════════════════════

steps:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & Push juragan-api (NestJS GraphQL + AI Studio Backend)
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-api'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:latest'
      - './middleware'

  - id: 'push-api'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-api']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware'

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Deploy juragan-api & capture public GraphQL URL
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-api'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-api']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        # Sensitive keys: prefer --set-secrets over plaintext substitutions
        # (SUPABASE_SERVICE_KEY, S3_ACCESS_KEY, S3_SECRET_KEY). Placeholders
        # below are for non-secret URLs / public anon key wiring only.
        gcloud run deploy "${_API_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/middleware:${_IMAGE_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=4001 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,SUPABASE_URL=${_SUPABASE_URL},SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY},S3_ENDPOINT=${_S3_ENDPOINT},S3_BUCKET=${_S3_BUCKET},HERMES_BASE_URL=${_HERMES_BASE_URL}"

        API_URL=$$(gcloud run services describe "${_API_SERVICE}" --region="${_REGION}" --format='value(status.url)')
        echo "juragan-api deployed at: $${API_URL}"
        if [ -n "${_NEXT_PUBLIC_GRAPHQL_URL}" ]; then
          echo "${_NEXT_PUBLIC_GRAPHQL_URL}" > /workspace/graphql_url.txt
        else
          echo "$${API_URL}/graphql" > /workspace/graphql_url.txt
        fi
        echo "$${API_URL}" > /workspace/api_url.txt

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Build & Push juragan (admin Next.js) — needs GraphQL URL from API
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-admin'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['deploy-api']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        GRAPHQL_URL=$$(cat /workspace/graphql_url.txt)
        echo "Building admin with NEXT_PUBLIC_GRAPHQL_URL=$${GRAPHQL_URL}"
        docker build \
          --build-arg NEXT_PUBLIC_GRAPHQL_URL="$${GRAPHQL_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_NEXT_PUBLIC_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${_NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_S3_ENDPOINT="${_S3_ENDPOINT}" \
          --build-arg NEXT_PUBLIC_S3_BUCKET="${_S3_BUCKET}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:${_IMAGE_TAG}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:latest" \
          ./admin

  - id: 'push-admin'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-admin']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin'

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Deploy juragan (admin)
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-admin'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-admin']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        GRAPHQL_URL=$$(cat /workspace/graphql_url.txt)
        gcloud run deploy "${_ADMIN_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/admin:${_IMAGE_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_PUBLIC_GRAPHQL_URL=$${GRAPHQL_URL},GRAPHQL_API_URL=$${GRAPHQL_URL},NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY},NEXT_PUBLIC_S3_ENDPOINT=${_S3_ENDPOINT},NEXT_PUBLIC_S3_BUCKET=${_S3_BUCKET}"

        ADMIN_URL=$$(gcloud run services describe "${_ADMIN_SERVICE}" --region="${_REGION}" --format='value(status.url)')
        echo "juragan deployed at: $${ADMIN_URL}"
        echo "$${ADMIN_URL}" > /workspace/admin_url.txt

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Build & Push juragan-landing (can start after API; no bake deps)
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-landing'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['deploy-api']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/landing-page:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/landing-page:latest'
      - './landing-page'

  - id: 'push-landing'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-landing']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/landing-page'

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Deploy juragan-landing
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-landing'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-landing']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        gcloud run deploy "${_LANDING_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/landing-page:${_IMAGE_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_PUBLIC_CMS_API_URL=${_NEXT_PUBLIC_CMS_API_URL},NEXT_PUBLIC_KASIR_WA_URL=${_NEXT_PUBLIC_KASIR_WA_URL}"

        LANDING_URL=$$(gcloud run services describe "${_LANDING_SERVICE}" --region="${_REGION}" --format='value(status.url)')
        echo "juragan-landing deployed at: $${LANDING_URL}"
        echo "$${LANDING_URL}" > /workspace/landing_url.txt

  # ───────────────────────────────────────────────────────────────────────────
  # 7. Build & Push juragan-showcase (brochure-gallery) — needs admin + landing URLs
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'build-showcase'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['deploy-admin', 'deploy-landing']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        ADMIN_URL=$$(cat /workspace/admin_url.txt)
        LANDING_URL=$$(cat /workspace/landing_url.txt)
        echo "Building showcase with ADMIN_URL=$${ADMIN_URL} LANDING_URL=$${LANDING_URL}"
        docker build \
          --build-arg NEXT_PUBLIC_SUPABASE_URL="${_NEXT_PUBLIC_SUPABASE_URL}" \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${_NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
          --build-arg NEXT_PUBLIC_S3_ENDPOINT="${_S3_ENDPOINT}" \
          --build-arg NEXT_PUBLIC_S3_BUCKET="${_S3_BUCKET}" \
          --build-arg NEXT_PUBLIC_ADMIN_URL="$${ADMIN_URL}" \
          --build-arg NEXT_PUBLIC_LANDING_URL="$${LANDING_URL}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery:${_IMAGE_TAG}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery:latest" \
          ./brochure-gallery

  - id: 'push-showcase'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-showcase']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery'

  # ───────────────────────────────────────────────────────────────────────────
  # 8. Deploy juragan-showcase
  # ───────────────────────────────────────────────────────────────────────────
  - id: 'deploy-showcase'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-showcase']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        ADMIN_URL=$$(cat /workspace/admin_url.txt)
        LANDING_URL=$$(cat /workspace/landing_url.txt)
        gcloud run deploy "${_SHOWCASE_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/brochure-gallery:${_IMAGE_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --port=3000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=10 \
          --allow-unauthenticated \
          --set-env-vars="NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY},NEXT_PUBLIC_S3_ENDPOINT=${_S3_ENDPOINT},NEXT_PUBLIC_S3_BUCKET=${_S3_BUCKET},NEXT_PUBLIC_ADMIN_URL=$${ADMIN_URL},NEXT_PUBLIC_LANDING_URL=$${LANDING_URL}"

substitutions:
  _REGION: 'asia-southeast2'
  # Legacy Artifact Registry repo name — keep unless ops renames AR in GCP.
  _AR_REPO: 'nusantarasoft'
  _IMAGE_TAG: 'latest'
  # Cloud Run service names (must match live services — migration-safe updates)
  _API_SERVICE: 'juragan-api'
  _ADMIN_SERVICE: 'juragan'
  _LANDING_SERVICE: 'juragan-landing'
  _SHOWCASE_SERVICE: 'juragan-showcase'
  _NEXT_PUBLIC_GRAPHQL_URL: ''
  # Point these at VPS nusantarasoft (or public Supabase/S3 URLs) — not GCP replacements
  _SUPABASE_URL: 'https://your-supabase-or-vps-kong.example'
  _NEXT_PUBLIC_SUPABASE_URL: 'https://your-supabase-or-vps-kong.example'
  # Public anon key only in substitutions if unavoidable; prefer Secret Manager for service role / S3 keys
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: 'replace-with-supabase-anon-key'
  _S3_ENDPOINT: 'https://your-vps-s3-or-gcs.example'
  _S3_BUCKET: 'cms-media'
  _HERMES_BASE_URL: 'https://hermes.your-vps.example'
  _NEXT_PUBLIC_CMS_API_URL: ''
  _NEXT_PUBLIC_KASIR_WA_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '2400s'
