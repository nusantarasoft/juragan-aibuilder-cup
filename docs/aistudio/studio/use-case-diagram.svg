  <text x="236" y="1164" class="section" fill="#92400e">Catatan Indeksasi vs Vektorisasi</text>
  <text x="236" y="1186" class="note">- Indeksasi (UI) = seluruh pipeline UC-19 s/d UC-22, bukan hanya upload file ke MinIO.</text>
  <text x="236" y="1206" class="note">- Vektorisasi (UC-21) = embedText() tiap chunk via Vertex AI / Google AI. Output disimpan di studio_source_chunks.</text>
  <text x="236" y="1226" class="note">- UC-05 s/d UC-09: satu panel Sources (sidebar) — tambah file, upload, hapus, reindex, pantau tervektor.</text>
  <text x="236" y="1246" class="note">- UC-10 Chat RAG melakukan semantic search terhadap vektor chunk; tanpa UC-21 jawaban tidak ter-grounding.</text>
  <text x="236" y="1266" class="note">- UC-18/18b: Playground sandbox via studioPlaygroundTest (tanpa RAG). Chart latency = run sesi ini.</text>
  <text x="236" y="1286" class="note">- Kode: middleware studio.service.playgroundTest, vertex-ai/claude playgroundGenerate</text>

