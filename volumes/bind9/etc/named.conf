// Main BIND config - required by sameersbn/bind (mount creates /data/bind/etc so default is not copied)
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
};

include "/data/bind/etc/named.conf.local";
