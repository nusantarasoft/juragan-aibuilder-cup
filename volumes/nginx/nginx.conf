worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Rate Limiting ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

    # ── Upstream Definitions ──────────────────────────────
    upstream admin_app {
        server admin:3000;
    }

    upstream middleware_api {
        server middleware:4001;
    }

    upstream supabase_api {
        server kong:8000;
    }

    upstream supabase_studio {
        server supabase-studio:3000;
    }

    upstream minio_console {
        server minio:9001;
    }

    # ── Health Check Endpoint ─────────────────────────────
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # ── Admin Dashboard (port 3003 → internal 3000) ──
        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://admin_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── GraphQL API ──────────────────────────────────
        location /graphql {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://middleware_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Supabase API ─────────────────────────────────
        location /supabase/ {
            limit_req zone=api burst=30 nodelay;
            rewrite ^/supabase/(.*) /$1 break;
            proxy_pass http://supabase_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Supabase Studio ──────────────────────────────
        location /studio/ {
            rewrite ^/studio/(.*) /$1 break;
            proxy_pass http://supabase_studio;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }

        # ── MinIO Console ────────────────────────────────
        location /minio/ {
            rewrite ^/minio/(.*) /$1 break;
            proxy_pass http://minio_console;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }
    }
}
