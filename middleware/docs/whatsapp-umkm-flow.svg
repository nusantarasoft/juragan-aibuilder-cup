  <text x="640" y="1410" class="box-desc">1. bye to goodbye</text>
  <text x="640" y="1430" class="box-desc">2. bantuan / help / menu to help</text>
  <text x="640" y="1450" class="box-desc">3. laporan / rekap / omzet to do_report</text>
  <text x="640" y="1470" class="box-desc">4. regex penjualan hari ini to do_report</text>
  <text x="640" y="1490" class="box-desc">5. regex jual / catat / order to do_record</text>
  <text x="640" y="1510" class="box-desc">6. default (sisanya) to do_record</text>
  <text x="640" y="1540" class="box-desc" font-style="italic">Parsing gagal: minta format ulang</text>
  <text x="640" y="1565" class="box-desc">Contoh: jual 3 es kopi 45000 tunai</text>

