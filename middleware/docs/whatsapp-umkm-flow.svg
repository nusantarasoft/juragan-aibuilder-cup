  <!-- 5. Setup -->
  <text x="60" y="2110" class="section-title">5. Alur Setup Admin (Sekali)</text>
  <rect x="40" y="2125" width="1020" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <rect x="55" y="2148" width="110" height="44" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="110" y="2175" text-anchor="middle" class="box-desc">DB schema</text>
  <text x="175" y="2175" class="flow-label">-&gt;</text>
  <rect x="190" y="2148" width="100" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="240" y="2175" text-anchor="middle" class="box-desc">Pair WAHA</text>
  <text x="305" y="2175" class="flow-label">-&gt;</text>
  <rect x="320" y="2148" width="110" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="375" y="2175" text-anchor="middle" class="box-desc">Notebook</text>
  <text x="445" y="2175" class="flow-label">-&gt;</text>
  <rect x="460" y="2148" width="150" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="535" y="2175" text-anchor="middle" class="box-desc">Setup UMKM flow</text>
  <text x="625" y="2175" class="flow-label">-&gt;</text>
  <rect x="640" y="2148" width="160" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="720" y="2175" text-anchor="middle" class="box-desc">WA config + allowlist</text>
  <text x="815" y="2175" class="flow-label">-&gt;</text>
