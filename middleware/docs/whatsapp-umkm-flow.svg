  <line x1="260" y1="1588" x2="270" y2="1610" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="350" y="1610" width="120" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="410" y="1635" text-anchor="middle" class="box-desc">sales_report</text>
