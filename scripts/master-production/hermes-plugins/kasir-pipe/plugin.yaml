name: kasir-pipe
label: Kasir WhatsApp pair + DB allowlist gate
version: 1.3.6
description: >
  Serves /pair/* for admin QR pairing and proxies the Baileys bridge for
  outbound send. Allowlisted WhatsApp senders reach the Hermes agent.
  Non-allowlisted senders get the DAFTAR registration funnel (unless
  KASIR_REGISTRATION=0). Stamps active sender for kasir-tools tenant resolve.
  Chat-only by default (KASIR_MULTIMODAL=0): photo/voice/file get a short
  text refuse and skip the agent. Sanitizes agent LLM output via
  transform_llm_output (user_safe denylist) before WhatsApp delivery.
  No middleware webhook forward.
author: NusantaraSoft
provides_hooks:
  - pre_gateway_dispatch
  - transform_llm_output
