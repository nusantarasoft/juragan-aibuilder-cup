<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" font-family="system-ui,Segoe UI,sans-serif">
  <title>L5 - Hermes runtime</title>
  <rect width="980" height="590" fill="#f7f5f0"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#1a1a1a">Level 5 - Hermes runtime (containers / ports)</text>
  <text x="24" y="58" font-size="12" fill="#555">Kasir inbound stays in Hermes. Middleware only outbound send + pair via :8765.</text>
  <text x="24" y="76" font-size="11" fill="#555">Tool returns sanitized (user_safe). Ops home: WHATSAPP_HOME_CHANNEL (not UMKM owner chats).</text>

  <!-- WhatsApp -->
  <rect x="24" y="100" width="140" height="70" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="94" y="132" text-anchor="middle" font-size="13" font-weight="600">WhatsApp</text>
  <text x="94" y="152" text-anchor="middle" font-size="11" fill="#666">owner phones</text>

  <!-- Hermes box -->
  <rect x="200" y="90" width="520" height="360" rx="12" fill="#fff" stroke="#2c5f4a" stroke-width="2"/>
  <text x="220" y="118" font-size="14" font-weight="700" fill="#2c5f4a">Hermes container</text>

  <rect x="220" y="140" width="200" height="56" rx="8" fill="#e8f2ec" stroke="#2c5f4a"/>
  <text x="320" y="164" text-anchor="middle" font-size="12" font-weight="600">Baileys bridge</text>
  <text x="320" y="182" text-anchor="middle" font-size="11" fill="#555">127.0.0.1:3000</text>

  <rect x="460" y="140" width="220" height="56" rx="8" fill="#e8f2ec" stroke="#2c5f4a"/>
  <text x="570" y="164" text-anchor="middle" font-size="12" font-weight="600">Gateway + LLM</text>
  <text x="570" y="182" text-anchor="middle" font-size="11" fill="#555">+ kasir-tools (user_safe)</text>

  <rect x="220" y="230" width="460" height="70" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="258" text-anchor="middle" font-size="13" font-weight="600">kasir-pipe pre_gateway_dispatch</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#666">allowlist OK -&gt; stamp sender -&gt; agent ; deny -&gt; DAFTAR / skip</text>

  <rect x="220" y="330" width="220" height="56" rx="8" fill="#e8f2ec" stroke="#2c5f4a"/>
  <text x="330" y="354" text-anchor="middle" font-size="12" font-weight="600">Proxy + /pair/*</text>
  <text x="330" y="372" text-anchor="middle" font-size="11" fill="#555">0.0.0.0:8765 -&gt; :3000</text>

  <rect x="460" y="330" width="220" height="56" rx="8" fill="#fff7ed" stroke="#b45309"/>
  <text x="570" y="354" text-anchor="middle" font-size="12" font-weight="600">DAFTAR wizard</text>
  <text x="570" y="372" text-anchor="middle" font-size="11" fill="#666">non-LLM -&gt; registrations</text>

  <text x="220" y="430" font-size="11" fill="#555">Volume ./volumes/hermes -&gt; /opt/data (creds, session, plugins, SOUL)</text>

  <!-- Middleware -->
  <rect x="760" y="90" width="196" height="200" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="858" y="118" text-anchor="middle" font-size="13" font-weight="700">Middleware</text>
  <rect x="780" y="140" width="156" height="56" rx="8" fill="#e8f2ec" stroke="#2c5f4a"/>
  <text x="858" y="164" text-anchor="middle" font-size="12" font-weight="600">HermesProvider</text>
  <text x="858" y="182" text-anchor="middle" font-size="10" fill="#555">send / pair</text>
  <rect x="780" y="210" width="156" height="56" rx="8" fill="#eee" stroke="#777"/>
  <text x="858" y="234" text-anchor="middle" font-size="11" font-weight="600">/whatsapp/webhook</text>
  <text x="858" y="252" text-anchor="middle" font-size="10" fill="#666">Simulasi / legacy only</text>

  <!-- Supabase -->
  <rect x="760" y="320" width="196" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="858" y="348" text-anchor="middle" font-size="13" font-weight="700">Supabase</text>
  <text x="858" y="372" text-anchor="middle" font-size="11" fill="#555">whatsapp_config</text>
  <text x="858" y="390" text-anchor="middle" font-size="11" fill="#555">registrations / stok</text>

  <!-- arrows -->
  <path d="M164 135 H200" stroke="#333" stroke-width="2" marker-end="url(#a5)"/>
  <path d="M320 196 V230" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a5g)"/>
  <path d="M570 196 V230" stroke="#2c5f4a" stroke-width="2"/>
  <path d="M330 300 V330" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a5g)"/>
  <path d="M570 300 V330" stroke="#b45309" stroke-width="2" marker-end="url(#a5o)"/>
  <path d="M760 168 H720 V358 H440" stroke="#2c5f4a" stroke-width="2" fill="none" marker-start="url(#a5g)"/>
  <text x="700" y="158" font-size="10" fill="#2c5f4a">HERMES_BRIDGE_URL</text>
  <path d="M680 360 H760" stroke="#333" stroke-width="2" marker-end="url(#a5)"/>
  <path d="M680 250 H760" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a5g)"/>
  <text x="690" y="242" font-size="10" fill="#2c5f4a">tools / allowlist</text>

  <text x="24" y="520" font-size="12" fill="#666">Approve notify: Nest -&gt; HermesProvider -&gt; POST /send on :8765. Not Nest webhook inbound.</text>
  <text x="24" y="542" font-size="12" fill="#666">docs/aistudio/umkm-wa/system/hermes-architecture.md · WHATSAPP_HOME_CHANNEL = ops/agent JID</text>
  <text x="24" y="564" font-size="11" fill="#888">AI Studio / system diagram (L5). Business flows: ../business/ L0–L4.</text>

  <defs>
    <marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker>
    <marker id="a5g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2c5f4a"/></marker>
    <marker id="a5o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
</svg>
