<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui,Segoe UI,sans-serif">
  <title>L2 - Swimlane Owner vs Admin</title>
  <rect width="960" height="520" fill="#f7f5f0"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#1a1a1a">Level 2 - Siapa melakukan apa</text>
  <text x="24" y="58" font-size="12" fill="#555">Dua aktor saja (B1): Owner WA + Admin CMS. Open funnel (B2), SLA &lt;=24 jam (B3).</text>
  <rect x="24" y="80" width="560" height="400" rx="12" fill="#fff" stroke="#d4cfc4"/>
  <rect x="24" y="80" width="560" height="36" rx="12" fill="#e8f2ec"/>
  <text x="40" y="104" font-size="14" font-weight="700" fill="#2c5f4a">Owner (WhatsApp)</text>
  <rect x="48" y="136" width="160" height="44" rx="8" fill="#f7f5f0" stroke="#2c5f4a"/>
  <text x="128" y="163" text-anchor="middle" font-size="12">Chat nomor NS</text>
  <path d="M128 180 V200" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="48" y="204" width="160" height="44" rx="8" fill="#fff7ed" stroke="#b45309"/>
  <text x="128" y="231" text-anchor="middle" font-size="12">Belum allowlist?</text>
  <path d="M128 248 V268" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="48" y="272" width="160" height="44" rx="8" fill="#fff" stroke="#b45309"/>
  <text x="128" y="292" text-anchor="middle" font-size="12">DAFTAR - nama - YA</text>
  <text x="128" y="308" text-anchor="middle" font-size="10" fill="#666">status pending</text>
  <path d="M208 294 H250" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="230" y="286" font-size="10" fill="#1d4ed8">pending</text>
  <path d="M128 316 V336" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="48" y="340" width="160" height="44" rx="8" fill="#f7f5f0" stroke="#555"/>
  <text x="128" y="367" text-anchor="middle" font-size="12">Tunggu &lt;=24 jam</text>
  <path d="M128 384 V404" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="48" y="408" width="160" height="44" rx="8" fill="#2c5f4a"/>
  <text x="128" y="435" text-anchor="middle" font-size="12" fill="#fff">cek stok = hidup</text>
  <path d="M250 320 H300 V430 H128" fill="none" stroke="#2c5f4a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="260" y="400" font-size="10" fill="#2c5f4a">setelah Approve</text>
  <text x="260" y="414" font-size="10" fill="#2c5f4a">(+ tunggu &gt;=5s)</text>
  <rect x="620" y="80" width="316" height="400" rx="12" fill="#fff" stroke="#d4cfc4"/>
  <rect x="620" y="80" width="316" height="36" rx="12" fill="#e0e7ff"/>
  <text x="636" y="104" font-size="14" font-weight="700" fill="#1d4ed8">Admin (CMS UMKM)</text>
  <rect x="660" y="160" width="200" height="50" rx="8" fill="#eef2ff" stroke="#1d4ed8"/>
  <text x="760" y="190" text-anchor="middle" font-size="12">Lihat Menunggu approve</text>
  <path d="M760 210 V230" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a2b)"/>
  <rect x="660" y="234" width="200" height="44" rx="8" fill="#fff" stroke="#1d4ed8"/>
  <text x="760" y="261" text-anchor="middle" font-size="12">Layak diaktifkan?</text>
  <path d="M720 278 V298" stroke="#2c5f4a" stroke-width="2"/>
  <text x="700" y="292" font-size="10" fill="#2c5f4a">Ya</text>
  <rect x="640" y="302" width="120" height="44" rx="8" fill="#2c5f4a"/>
  <text x="700" y="329" text-anchor="middle" font-size="12" fill="#fff">Approve 1x</text>
  <path d="M800 278 V298" stroke="#b45309" stroke-width="2"/>
  <text x="808" y="292" font-size="10" fill="#b45309">Tidak</text>
  <rect x="760" y="302" width="120" height="44" rx="8" fill="#fff7ed" stroke="#b45309"/>
  <text x="820" y="329" text-anchor="middle" font-size="12">Tolak</text>
  <text x="660" y="380" font-size="11" fill="#666">Tolak -&gt; owner boleh DAFTAR lagi (B5)</text>
  <text x="660" y="400" font-size="11" fill="#666">1 toko = 1 HP owner (B6)</text>
  <path d="M250 294 H660" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2c5f4a"/></marker>
    <marker id="a2b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker>
  </defs>
</svg>
