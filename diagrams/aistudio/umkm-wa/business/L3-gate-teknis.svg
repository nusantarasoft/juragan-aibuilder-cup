<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui,Segoe UI,sans-serif">
  <title>L3 - Gate teknis allowlist</title>
  <rect width="900" height="480" fill="#f7f5f0"/>
  <text x="24" y="36" font-size="18" font-weight="700" fill="#1a1a1a">Level 3 - Gate teknis (kasir-pipe)</text>
  <text x="24" y="58" font-size="12" fill="#555">Setiap pesan WA: allowlist? -&gt; kasir AIDLC : wizard DAFTAR (non-LLM)</text>
  <rect x="340" y="90" width="200" height="48" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="440" y="120" text-anchor="middle" font-size="13" font-weight="600">Pesan WA masuk</text>
  <path d="M440 138 V168" stroke="#333" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="300" y="172" width="280" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="198" text-anchor="middle" font-size="13" font-weight="600">Pengirim di allowlist?</text>
  <text x="440" y="216" text-anchor="middle" font-size="11" fill="#666">studio_whatsapp_config</text>
  <path d="M300 200 H160" stroke="#2c5f4a" stroke-width="2"/>
  <path d="M160 200 V240" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a3g)"/>
  <text x="220" y="192" font-size="11" fill="#2c5f4a">Ya</text>
  <rect x="60" y="248" width="200" height="70" rx="8" fill="#2c5f4a"/>
  <text x="160" y="278" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Kasir AIDLC</text>
  <text x="160" y="298" text-anchor="middle" font-size="11" fill="#d7ebe1">intent -&gt; preview -&gt; commit</text>
  <path d="M580 200 H720" stroke="#b45309" stroke-width="2"/>
  <path d="M720 200 V240" stroke="#b45309" stroke-width="2" marker-end="url(#a3o)"/>
  <text x="640" y="192" font-size="11" fill="#b45309">Tidak</text>
  <rect x="620" y="248" width="200" height="56" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="720" y="282" text-anchor="middle" font-size="12" font-weight="600">KASIR_REGISTRATION?</text>
  <path d="M680 304 V330" stroke="#555" stroke-width="2"/>
  <text x="650" y="324" font-size="10" fill="#555">0</text>
  <rect x="600" y="334" width="120" height="44" rx="8" fill="#eee" stroke="#777"/>
  <text x="660" y="361" text-anchor="middle" font-size="12">Silent skip</text>
  <path d="M760 304 V330" stroke="#b45309" stroke-width="2"/>
  <text x="768" y="324" font-size="10" fill="#b45309">1</text>
  <rect x="720" y="334" width="160" height="70" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <text x="800" y="364" text-anchor="middle" font-size="12" font-weight="600">Wizard DAFTAR</text>
  <text x="800" y="384" text-anchor="middle" font-size="11" fill="#666">non-LLM state machine</text>
  <rect x="60" y="360" width="200" height="50" rx="8" fill="#e8f2ec" stroke="#2c5f4a"/>
  <text x="160" y="390" text-anchor="middle" font-size="11">DB stok / orders / katalog</text>
  <path d="M160 318 V360" stroke="#2c5f4a" stroke-width="2" marker-end="url(#a3g)"/>
  <text x="24" y="450" font-size="12" fill="#666">Rollback trial: KASIR_REGISTRATION=0 -&gt; nomor asing kembali silent skip.</text>
  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker>
    <marker id="a3g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2c5f4a"/></marker>
    <marker id="a3o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b45309"/></marker>
  </defs>
</svg>
